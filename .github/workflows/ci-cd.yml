name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository }}-backend

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Run tests
        run: npm test
        working-directory: backend

      - name: Security audit
        run: npm audit --omit=dev --audit-level=high
        working-directory: backend

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: |
          echo "image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]'):${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.image }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Copy application config to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,nginx,frontend,monitoring"
          target: "~/project1/project_final1"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMG: ${{ needs.build.outputs.image }}
          GH_USER: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMG,GH_USER,GH_TOKEN

          script: |
            set -e

            cd ~/project1/project_final1

            echo "=== Checking environment ==="

            test -f .env || {
              echo "ERROR: ~/project1/project_final1/.env belum ada"
              exit 1
            }

            for VAR in POSTGRES_PASSWORD GRAFANA_PASSWORD JWT_SECRET; do
              grep -q "^${VAR}=.\+" .env || {
                echo "ERROR: ${VAR} belum diset di .env"
                exit 1
              }
            done

            echo "Environment OK"

            echo "=== Login to GHCR ==="

            echo "$GH_TOKEN" | docker login ghcr.io \
              -u "$GH_USER" \
              --password-stdin

            echo "=== Update backend image ==="

            sed -i '/^BACKEND_IMAGE=/d' .env
            echo "BACKEND_IMAGE=$IMG" >> .env

            echo "Using image:"
            grep '^BACKEND_IMAGE=' .env

            echo "=== Validate Docker Compose ==="

            docker compose config >/dev/null

            echo "Compose configuration OK"

            echo "=== Pull new backend image ==="

            docker compose pull backend

            echo "=== Deploy application ==="

            docker compose up -d --remove-orphans

            echo "=== Waiting for services ==="

            sleep 10

            echo "=== Container status ==="

            docker compose ps

            echo "=== Backend health ==="

            curl -fsS http://localhost/api/health

            echo
            echo "=== Deployment successful ==="

            echo "=== Cleaning unused images ==="

            docker image prune -f
